<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 — CSS Grid Photo Gallery (Even Variant)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="gallery" aria-label="Travel photo gallery">
      <figure class="photo photo--main">
        <img src="https://picsum.photos/id/1018/1200/800" alt="Mountain trail through green forest under blue sky">
      </figure>
      <figure class="photo">
        <img src="https://picsum.photos/id/1015/600/400" alt="Golden sandy bay surrounded by green hills">
      </figure>
      <figure class="photo">
        <img src="https://picsum.photos/id/1039/600/400" alt="Turquoise cove beach with rocky shore">
      </figure>
      <figure class="photo">
        <img src="https://picsum.photos/id/1036/600/400" alt="Rocky alpine stream leading toward snowy peak">
      </figure>
      <figure class="photo">
        <img src="https://picsum.photos/id/1043/600/400" alt="Red coastal blossoms overlooking calm harbor">
      </figure>
      <figure class="photo">
        <img src="https://picsum.photos/id/1060/600/400" alt="Busy local street market scene">
      </figure>
      <figure class="photo">
        <img src="https://picsum.photos/id/1050/600/400" alt="Traditional wooden boats moored in clear water">
      </figure>
      <figure class="photo">
        <img src="https://picsum.photos/id/1071/600/400" alt="Yellow and green vintage food truck">
      </figure>
      <figure class="photo">
        <img src="https://picsum.photos/id/1078/600/400" alt="Stone cottage behind tropical garden plants">
      </figure>
      <figure class="photo">
        <img src="https://picsum.photos/id/1062/600/400" alt="Outdoor cafe table with coffee cups">
      </figure>
    </section>
  </main>
</body>
</html>
