<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №6. Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">
    <div class="widget">
        <div class="card">
            <p class="card-info">Чернівці, хмарно</p>
        </div>

        <div class="arrows">
            <a class="arrow" href="#" title="Попередній день">&larr;</a><a class="arrow" href="#" title="Наступний день">&rarr;</a>
        </div>

        <img class="cloud" src="img/cloud.svg" alt="Хмарно">
        <div class="temp">17</div>

        <ul class="forecast">
            <li class="day"><span class="day-name">Mon</span><span class="day-temp">17°</span></li>
            <li class="day"><span class="day-name">Tue</span><span class="day-temp">19°</span></li>
            <li class="day"><span class="day-name">Wed</span><span class="day-temp">16°</span></li>
            <li class="day"><span class="day-name">Thu</span><span class="day-temp">18°</span></li>
            <li class="day"><span class="day-name">Fri</span><span class="day-temp">21°</span></li>
        </ul>
    </div>
</body>
</html>
