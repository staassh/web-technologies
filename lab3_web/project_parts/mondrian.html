<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Завдання 2</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .picture {
        width: 500px;
        height: 541px;
        margin: 0 auto;
        border-collapse: collapse;
        border-spacing: 0;
        table-layout: fixed;
        background: #000000;
        overflow: hidden;
    }

    .picture td {
        padding: 0;
        border: 0;
        vertical-align: top;
    }

    .white  { background: #ffffff; }
    .black  { background: #000000; }
    .red    { background: #ff5b2d; }
    .yellow { background: #fffa69; }
    .blue   { background: #074481; }

    /* Чорний квадрат 2 × 2 */
    .black-grid {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        border-spacing: 0;
        table-layout: fixed;
        background: #000000;
    }

    .black-grid td {
        padding: 0;
        background: #000000;
        border: 0;
    }

    .black-grid tr:first-child td {
        border-bottom: 4px solid #000000;
    }

    .black-grid td:first-child {
        border-right: 4px solid #000000;
    }

    .back {
        display: inline-block;
        margin: 20px 0;
        font-size: 16px;
    }
</style>
</head>

<body>

<table class="picture" aria-label="Композиція з червоним, синім і жовтим">

    <colgroup>
        <col style="width:46px">
        <col style="width:10px">
        <col style="width:5px">
        <col style="width:55px">
        <col style="width:10px">
        <col style="width:65px">
        <col style="width:10px">
        <col style="width:126px">
        <col style="width:10px">
        <col style="width:78px">
        <col style="width:10px">
        <col style="width:75px">
    </colgroup>

    <!-- 0–46 px -->
    <tr style="height:47px">
        <td class="white" colspan="4"></td>
        <td class="black"></td>
        <td class="white" colspan="3"></td>
        <td class="black"></td>
        <td class="yellow" colspan="3"></td>
    </tr>

    <!-- 47–56 px -->
    <tr style="height:10px">
        <td class="black" colspan="12"></td>
    </tr>

    <!-- 57–184 px -->
    <tr style="height:128px">
        <td class="white"></td>
        <td class="black"></td>

        <td class="red" colspan="6" rowspan="3"></td>
        <td class="black" rowspan="3"></td>

        <td class="yellow" colspan="3"></td>
    </tr>

    <!-- 185–194 px -->
    <tr style="height:10px">
        <td class="black" colspan="2"></td>
        <td class="black" colspan="3"></td>
    </tr>

    <!-- 195–323 px -->
    <tr style="height:129px">
        <td class="white"></td>
        <td class="black"></td>

        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
    </tr>

    <!-- 324–333 px -->
    <tr style="height:10px">
        <td class="white"></td>
        <td class="black" colspan="11"></td>
    </tr>

    <!-- 334–394 px -->
    <tr style="height:62px">
        <td class="white"></td>
        <td class="black"></td>

        <td colspan="4" rowspan="4">
            <table class="black-grid" aria-hidden="true">
                <tr>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                </tr>
            </table>
        </td>

        <td class="black" rowspan="7"></td>

        <td class="white"></td>
        <td class="black"></td>
        <td class="white" colspan="3"></td>
    </tr>

    <!-- 395–405 px -->
    <tr style="height:10px">
        <td class="black" colspan="2"></td>
        <td class="black" colspan="5"></td>
    </tr>

    <!-- 406–462 px -->
    <tr style="height:57px">
        <td class="yellow" rowspan="5"></td>
        <td class="black"></td>

        <td class="white"></td>
        <td class="black" rowspan="4"></td>

        <td class="blue" colspan="3" rowspan="3"></td>
    </tr>

    <!-- 463–472 px -->
    <tr style="height:10px">
        <td class="black"></td>
        <td class="black"></td>
    </tr>

    <!-- 473–499 px -->
    <tr style="height:27px">
        <td class="black" colspan="2"></td>

        <td class="white" colspan="3" rowspan="3"></td>

        <td class="black"></td>
    </tr>

    <!-- 500–509 px -->
    <tr style="height:10px">
        <td class="black" colspan="2"></td>
        <td class="black"></td>
        <td class="black" colspan="3"></td>
    </tr>

    <!-- 510–540 px -->
    <tr style="height:31px">
        <td class="black" colspan="2"></td>

        <td class="white" colspan="5"></td>
    </tr>

</table>

<a class="back" href="../index.html">Повернутись на головну</a>

</body>
</html>
